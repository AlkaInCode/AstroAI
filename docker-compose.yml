services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: astroai
      POSTGRES_PASSWORD: astroai
      POSTGRES_DB: astroai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://astroai:astroai@db:5432/astroai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      ASTROLOGY_PROVIDER: ${ASTROLOGY_PROVIDER:-mock}
      PROKERALA_CLIENT_ID: ${PROKERALA_CLIENT_ID:-}
      PROKERALA_CLIENT_SECRET: ${PROKERALA_CLIENT_SECRET:-}
      ASTROENGINE_BASE_URL: ${ASTROENGINE_BASE_URL:-http://192.168.68.114:8000}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-mock}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
